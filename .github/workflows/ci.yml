name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: JS (Node ${{ matrix.node }}, ${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        package: [agent-kit, mcp, adapters]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfiles are committed (see .gitignore), so install rather than `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm test

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,langchain]"
      - run: python -m pytest -v
