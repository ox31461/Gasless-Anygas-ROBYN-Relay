[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anygas"
version = "0.2.0"
description = "AnyGas Python SDK — gasless cross-chain routing + yield-native gasless spending for AI agents (26 networks)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Robyn" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
signing = ["eth-account>=0.10"]
langchain = ["langchain-core>=0.1"]
test = ["pytest>=7", "eth-account>=0.10"]

[project.urls]
Homepage = "https://anygas.xyz"
Documentation = "https://api.anygas.xyz/llms.txt"
Repository = "https://github.com/ox31461/Gasless-Anygas-ROBYN-Relay"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
